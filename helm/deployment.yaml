apiVersion: apps/v1
kind: Deployment
metadata:
  name: note-flow
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: note-flow
  template:
    metadata:
      labels:
        app: note-flow
    spec:
      containers:
        - name: note-flow
          image: note-flow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: PROJECT_NAME
              value: note-flow
            - name: PROJECT_VERSION
              value: v1
            - name: POSTGRES_DSN
              value: postgresql+asyncpg://postgres:postgres@postgresql.db.svc.cluster.local:5432/note-flow
            - name: REDIS_DSN
              value: redis://redis.dv.svc.cluster.local:6379

          readinessProbe:
            httpGet:
              path: /note-flow/api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /note-flow/api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
