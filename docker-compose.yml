services:
  postgresql:
    environment:
      - POSTGRES_DB=note-flow
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    image: postgres:15-alpine
    ports:
      - "14104:5432"
    volumes:
      - $PWD/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5